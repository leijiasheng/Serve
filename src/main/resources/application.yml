server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: Server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/serverdb?serverTimezone=GMT%2B8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      stat-view-servlet:
        # 生产环境建议置为 false
        enabled: ${DRUID_CONSOLE_ENABLED:true}
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:}
        allow:
        deny:

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  jackson:
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 10
      batch-size: 16384
      buffer-memory: 33554432
      compression-type: snappy
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: test-consumer-group
      enable-auto-commit: false
      auto-offset-reset: latest
      max-poll-records: 50
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
        max.poll.interval.ms: 300000
    listener:
      ack-mode: manual_immediate

mybatis:
  mapper-locations: classpath:com/student/server/dao/*.xml

send:
  message:
    # QQ 邮箱需开启 SMTP 并使用授权码，而非登录密码
    email: ${SEND_MESSAGE_EMAIL:}
    code: ${SEND_MESSAGE_CODE:}

jwt:
  # 至少 256 bit（32 字节）随机字符串，请勿使用示例值；可用
  #   openssl rand -base64 48
  # 生成后通过环境变量注入
  secret: ${JWT_SECRET:}
  # 24h
  expiration: ${JWT_EXPIRATION:86400000}

upload:
  dir: ${UPLOAD_DIR:${user.dir}}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.student.server

kind: Application