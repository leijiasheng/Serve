# 所有敏感信息通过环境变量注入。
# 本地/部署时在项目根目录创建 .env 文件（已被 .gitignore 忽略），
# 可参考 .env.example，或直接在 shell 中 export 这些变量。
services:
  backend:
    build: .
    image: student-server:latest
    container_name: student-backend
    ports:
      - "${SERVER_PORT:-8085}:${SERVER_PORT:-8085}"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8085}

      # 数据库
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}

      # Redis
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD}

      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

      # JWT / 邮件
      - JWT_SECRET=${JWT_SECRET}
      - SEND_MESSAGE_EMAIL=${SEND_MESSAGE_EMAIL}
      - SEND_MESSAGE_CODE=${SEND_MESSAGE_CODE}

      # Druid 监控台
      - DRUID_CONSOLE_ENABLED=${DRUID_CONSOLE_ENABLED:-false}
      - DRUID_USERNAME=${DRUID_USERNAME:-admin}
      - DRUID_PASSWORD=${DRUID_PASSWORD}

      # 文件上传目录（与下方 volume 对应）
      - UPLOAD_DIR=/app
    volumes:
      - uploads-data:/app/uploads
    restart: unless-stopped

volumes:
  uploads-data: